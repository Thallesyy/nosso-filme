<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0510">
<title>a novela que eu não perdi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root { --rosa: #ff6fa3; --rosa-claro: #ffd1e0; --creme: #fff3e8; --ouro: #e2b56b; --fundo: #0a0510; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; background: var(--fundo); overflow: hidden; color: var(--creme);
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .letra { font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; }

  /* carregando */
  #carregando { position: fixed; inset: 0; z-index: 40; background: var(--fundo); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity 0.6s ease; }
  #carregando.some { opacity: 0; pointer-events: none; }
  #carregando .roda { width: 36px; height: 36px; border: 2px solid rgba(255, 209, 224, 0.2); border-top-color: var(--rosa); border-radius: 50%; animation: gira 0.9s linear infinite; }
  #carregando p { font-size: 14px; color: var(--rosa-claro); font-style: italic; padding: 0 24px; text-align: center; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* abertura: por cima da rua, que já aparece atrás */
  #abertura {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 0 26px; background: radial-gradient(ellipse at 50% 36%, rgba(10, 5, 16, 0.58) 0%, rgba(10, 5, 16, 0.9) 70%);
    transition: opacity 1.1s ease;
  }
  #abertura.some { opacity: 0; pointer-events: none; }
  #abertura .letra { font-size: 15px; color: var(--ouro); margin-bottom: 18px; }
  #abertura h1 { font-size: clamp(36px, 10.5vw, 64px); font-weight: 700; font-style: italic; line-height: 1.08; color: var(--creme); text-shadow: 0 0 34px rgba(255, 111, 163, 0.55); max-width: 11em; }
  #abertura .sub { font-size: clamp(14px, 3.8vw, 18px); font-style: italic; opacity: 0.8; margin: 18px 0 40px; }
  .botao {
    font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif; letter-spacing: 0.2em; font-size: 19px; text-transform: uppercase;
    background: linear-gradient(180deg, var(--rosa) 0%, #d9457a 100%); color: #fff; border: none; padding: 15px 38px 13px; border-radius: 30px; cursor: pointer;
    box-shadow: 0 8px 30px rgba(255, 111, 163, 0.4), 0 0 60px rgba(255, 111, 163, 0.2); transition: transform 0.15s ease;
  }
  .botao:active { transform: scale(0.96); }
  #abertura .dica { font-size: 12px; opacity: 0.55; margin-top: 22px; font-style: italic; }

  /* legenda de filme */
  #legenda {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; pointer-events: none; text-align: center; opacity: 0;
    padding: 0 22px calc(env(safe-area-inset-bottom, 0px) + max(1.5vh, 9px));
    font-size: clamp(15px, 4.1vw, 21px); font-style: italic; line-height: 1.28; color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 0, 0, 0.9), 0 0 2px #000;
  }
  #legenda.credito { font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif; font-style: normal; letter-spacing: 0.3em; text-transform: uppercase; font-size: clamp(15px, 4vw, 20px); color: var(--creme); }

  /* botões que ficam por cima */
  .fino {
    font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; font-size: 14px;
    background: rgba(20, 8, 18, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--rosa-claro); border: 1px solid rgba(255, 209, 224, 0.28); padding: 9px 15px 7px; border-radius: 18px; cursor: pointer;
  }
  .fino:active { background: rgba(255, 209, 224, 0.18); }
  #btnSom { position: fixed; z-index: 12; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 14px; width: 38px; height: 38px; padding: 0; font-size: 17px; letter-spacing: 0; display: none; }
  #btnPular { position: fixed; z-index: 12; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 14px; display: none; }
  .aparece { display: block !important; }

  #fim, #nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.8s ease; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 22px); }
  #fim.visivel, #nav.visivel { opacity: 1; pointer-events: auto; }
  #fim .linha, #nav .linha { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #fim .dica, #nav .dica { font-size: 12.5px; font-style: italic; opacity: 0.7; margin-bottom: 12px; text-shadow: 0 1px 4px #000; }
  #nav .nome { font-size: clamp(19px, 5.2vw, 26px); font-style: italic; font-weight: 700; text-shadow: 0 1px 6px #000, 0 0 16px rgba(0,0,0,0.8); margin-bottom: 4px; }
  .seta { position: fixed; top: 46%; z-index: 13; width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 24px; letter-spacing: 0; line-height: 1; display: none; }
  .seta.esq { left: 8px; } .seta.dir { right: 8px; }
  #nav.visivel ~ .seta.nav, #modal.visivel .seta { display: block; }

  /* o cartaz aberto */
  #modal { position: fixed; inset: 0; z-index: 30; background: radial-gradient(ellipse at center, rgba(52, 18, 42, 0.95) 0%, rgba(12, 4, 10, 0.985) 75%); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #modal.visivel { opacity: 1; pointer-events: auto; }
  #mCaixa { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 54px) 22px calc(env(safe-area-inset-bottom, 0px) + 28px); text-align: center; }
  #mFoto { max-width: min(100%, 520px); max-height: 56vh; border-radius: 4px; border: 5px solid var(--ouro); box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6); object-fit: contain; background: #1a0c16; }
  #mSobre { font-size: 15px; color: var(--rosa); margin-top: 20px; }
  #mTitulo { font-size: clamp(30px, 8.5vw, 46px); font-style: italic; font-weight: 700; line-height: 1.1; margin-top: 4px; }
  #mData { font-size: 14px; opacity: 0.8; margin-top: 8px; }
  #mSinopse { font-size: clamp(15px, 4vw, 18px); font-style: italic; line-height: 1.45; opacity: 0.92; margin-top: 14px; max-width: 26em; }
  #mFechar { position: fixed; z-index: 32; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 12px; width: 42px; height: 42px; padding: 0; font-size: 24px; letter-spacing: 0; border-radius: 50%; }
  #modal .seta { z-index: 32; }

  /* versão simples (sem 3D) */
  #simples { position: fixed; inset: 0; z-index: 35; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; background: radial-gradient(ellipse at 50% 0%, #34122a 0%, #0c040a 70%); padding: calc(env(safe-area-inset-top, 0px) + 46px) 20px calc(env(safe-area-inset-bottom, 0px) + 60px); text-align: center; }
  #simples.visivel { display: block; }
  #simples h1 { font-size: clamp(34px, 10vw, 58px); font-style: italic; line-height: 1.08; text-shadow: 0 0 30px rgba(255, 111, 163, 0.5); }
  #simples .sub { font-style: italic; opacity: 0.8; margin: 14px 0 26px; }
  #simples section { max-width: 560px; margin: 0 auto 54px; }
  #simples .cap { font-size: 15px; color: var(--rosa); }
  #simples h2 { font-size: clamp(28px, 8vw, 40px); font-style: italic; margin: 2px 0 4px; }
  #simples .data { font-size: 13px; opacity: 0.75; margin-bottom: 14px; }
  #simples figure { margin: 0 0 16px; }
  #simples img, #simples video { width: 100%; max-height: 78vh; object-fit: contain; border-radius: 4px; border: 4px solid var(--ouro); background: #1a0c16; display: block; }
  #simples figcaption { font-style: italic; font-size: 16px; margin-top: 8px; opacity: 0.92; }
  #simples .fim p { font-style: italic; font-size: 19px; line-height: 1.5; margin-bottom: 10px; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="carregando"><div class="roda"></div><p id="carregandoTexto">abrindo o cinema...</p></div>

<div id="abertura" class="some">
  <div class="letra" id="abCine"></div>
  <h1 id="abTitulo"></h1>
  <p class="sub" id="abSub"></p>
  <button class="botao" id="btnComecar"></button>
  <p class="dica">com som fica melhor ♪</p>
</div>

<div id="legenda"></div>
<button class="fino" id="btnPular"></button>
<button class="fino" id="btnSom">♪</button>

<div id="fim">
  <p class="dica" id="fimDica"></p>
  <div class="linha"><button class="fino" id="btnDeNovo"></button><button class="fino" id="btnSaguao"></button></div>
</div>

<div id="nav">
  <p class="nome" id="navNome"></p>
  <p class="dica" id="navDica"></p>
  <div class="linha"><button class="fino" id="btnSala"></button><button class="fino" id="btnDeNovo2"></button></div>
</div>
<button class="fino seta esq nav" id="navAnt">‹</button>
<button class="fino seta dir nav" id="navProx">›</button>

<div id="modal">
  <button class="fino" id="mFechar">×</button>
  <div id="mCaixa">
    <img id="mFoto" alt="">
    <div class="letra" id="mSobre"></div>
    <h2 id="mTitulo"></h2>
    <div class="letra" id="mData"></div>
    <p id="mSinopse"></p>
  </div>
  <button class="fino seta esq" id="mAnt">‹</button>
  <button class="fino seta dir" id="mProx">›</button>
</div>

<div id="simples">
  <div class="letra" style="font-size:15px;color:var(--ouro);margin-bottom:14px" id="sCine"></div>
  <h1 id="sTitulo"></h1>
  <p class="sub" id="sSub"></p>
  <div id="sLista"></div>
</div>

<audio id="musica" preload="none" playsinline></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="textos.js"></script>
<script src="fotos.js"></script>
<script src="js/base.js"></script>
<script src="js/fachada.js"></script>
<script src="js/saguao.js"></script>
<script src="js/sala.js"></script>
<script src="js/projecao.js"></script>
<script>
(function () {
  'use strict';
  var P = new URLSearchParams(location.search);
  var TESTE = P.get('teste') === '1';
  function $(id) { return document.getElementById(id); }
  var canvas = $('c'), elCarregando = $('carregando'), elAbertura = $('abertura'), elLegenda = $('legenda');
  var elFim = $('fim'), elNav = $('nav'), elModal = $('modal'), btnSom = $('btnSom'), btnPular = $('btnPular');
  var MID = window.MIDIA || { fotos: {}, videos: {} };

  /* ---------- os textos da página ---------- */
  $('abCine').textContent = 'cine ' + TEXTOS.cinema + ' apresenta';
  $('abTitulo').textContent = TEXTOS.titulo;
  $('abSub').textContent = TEXTOS.aberturaSub;
  $('btnComecar').textContent = TEXTOS.botao;
  btnPular.textContent = TEXTOS.pular;
  $('btnDeNovo').textContent = TEXTOS.verDeNovo; $('btnDeNovo2').textContent = TEXTOS.verDeNovo;
  $('btnSaguao').textContent = TEXTOS.irSaguao; $('btnSala').textContent = TEXTOS.voltarSala;
  $('fimDica').textContent = TEXTOS.dicaSentado; $('navDica').textContent = TEXTOS.dicaSaguao;
  document.title = TEXTOS.titulo;

  /* =====================================================================
     Música (um <audio> só, que troca de faixa) e os barulhinhos do projetor
     ===================================================================== */
  var audio = $('musica'), mudo = false, comecou = false, faixaAtual, oculto = false;
  var ORDEM = [MUSICAS.creditos, MUSICAS.filme, MUSICAS.entrada];
  function tocar() {
    if (TESTE || mudo || oculto || !faixaAtual) return;
    var p = audio.play(); if (p && p.catch) p.catch(function () {});
  }
  function faixa(id) {                    // id: nome da música, ou null pra silêncio
    if (id === faixaAtual) return;
    faixaAtual = id;
    if (!id) { audio.pause(); return; }
    audio.src = 'musicas/' + id + '.mp3';
    tocar();
  }
  audio.addEventListener('ended', function () {
    if (modo === 'livre' || modo === 'saguao' || simplesAtivo) { faixaAtual = undefined; faixa(ORDEM[(ORDEM.indexOf(audio.src.split('/').pop().replace('.mp3', '')) + 1) % ORDEM.length]); }
  });

  var ac = null, ganhoProjetor = null;
  function somIniciar() {                  // dentro do toque
    if (TESTE) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      // o projetor: um chiado baixo com 24 estalinhos por segundo
      var n = ac.sampleRate, buf = ac.createBuffer(1, n, n), d = buf.getChannelData(0), passo = Math.floor(n / 24), s = 12345;
      for (var i = 0; i < n; i++) {
        s = (s * 1103515245 + 12345) & 0x7fffffff;
        var r = s / 0x7fffffff * 2 - 1, k = i % passo;
        d[i] = r * 0.10 + (k < 70 ? r * (1 - k / 70) * 0.9 : 0);
      }
      var fonte = ac.createBufferSource(); fonte.buffer = buf; fonte.loop = true;
      var filtro = ac.createBiquadFilter(); filtro.type = 'bandpass'; filtro.frequency.value = 1700; filtro.Q.value = 0.6;
      ganhoProjetor = ac.createGain(); ganhoProjetor.gain.value = 0;
      fonte.connect(filtro); filtro.connect(ganhoProjetor); ganhoProjetor.connect(ac.destination);
      fonte.start();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function somProjetor(v) {
    if (!ac || !ganhoProjetor) return;
    try { ganhoProjetor.gain.setTargetAtTime(mudo || oculto ? 0 : v * 0.05, ac.currentTime, 0.25); } catch (e) {}
  }
  function somBipe() {
    if (!ac || mudo) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 1000; g.gain.value = 0.045; o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.085);
    } catch (e) {}
  }

  btnSom.addEventListener('click', function () {
    mudo = !mudo; audio.muted = mudo;
    btnSom.textContent = mudo ? '♪̸' : '♪';
    if (!mudo && comecou && audio.paused) tocar();
  });
  document.addEventListener('visibilitychange', function () {
    oculto = document.hidden;
    if (!comecou) return;
    if (oculto) { audio.pause(); if (proj) proj.pausar(); somProjetor(0); }
    else { tocar(); if (proj) proj.retomar(); }
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  /* =====================================================================
     Versão simples: se o 3D não abrir (ou cair duas vezes), o filme vira uma página
     ===================================================================== */
  var simplesAtivo = false;
  function mostrarSimples() {
    if (simplesAtivo) return;
    simplesAtivo = true;
    document.documentElement.style.touchAction = 'auto'; document.body.style.touchAction = 'auto';
    $('sCine').textContent = 'cine ' + TEXTOS.cinema + ' apresenta';
    $('sTitulo').textContent = TEXTOS.titulo; $('sSub').textContent = TEXTOS.aberturaSub;
    var lista = $('sLista');
    function secao(sobre, titulo, data, cenas) {
      var s = document.createElement('section'), h = '';
      if (sobre) h += '<div class="letra cap"></div>';
      h += '<h2></h2>' + (data ? '<div class="letra data"></div>' : '');
      s.innerHTML = h;
      if (sobre) s.querySelector('.cap').textContent = sobre;
      s.querySelector('h2').textContent = titulo;
      if (data) s.querySelector('.data').textContent = data;
      cenas.forEach(function (c) {
        var f = document.createElement('figure'), m;
        if (c.video && MID.videos[c.video]) {
          m = document.createElement('video'); m.src = 'videos/' + c.video + '.mp4'; m.poster = 'videos/' + c.video + '.jpg';
          m.controls = true; m.preload = 'none'; m.playsInline = true; m.setAttribute('playsinline', '');
        } else if (c.foto && MID.fotos[c.foto]) {
          m = document.createElement('img'); m.loading = 'lazy'; m.src = 'fotos/' + c.foto + '.jpg'; m.alt = '';
        } else return;
        f.appendChild(m);
        if (c.legenda) { var fc = document.createElement('figcaption'); fc.textContent = c.legenda; f.appendChild(fc); }
        s.appendChild(f);
      });
      lista.appendChild(s);
    }
    CAPITULOS.forEach(function (cap, i) {
      if (i === CAPITULOS.length - 1) secao(null, TEXTOS.osDias, null, OS_DIAS);
      secao(TEXTOS.capitulo + ' ' + (i + 1), cap.titulo, cap.data, cap.cenas);
    });
    var f = document.createElement('section'); f.className = 'fim';
    [TEXTOS.proximoTitulo + ':'].concat(PROXIMOS, [TEXTOS.continua, '', TEXTOS.fraseStory, TEXTOS.fimLinha1, TEXTOS.fimLinha2]).forEach(function (t) {
      var p = document.createElement('p'); p.textContent = t; f.appendChild(p);
    });
    lista.appendChild(f);
    canvas.style.display = 'none';
    elCarregando.classList.add('some'); elAbertura.classList.add('some');
    elFim.classList.remove('visivel'); elNav.classList.remove('visivel'); elLegenda.style.opacity = 0; btnPular.classList.remove('aparece');
    $('simples').classList.add('visivel');
    btnSom.classList.add('aparece');
    // a música começa no primeiro toque (o iPhone só deixa assim)
    function primeiro() {
      document.removeEventListener('pointerdown', primeiro);
      comecou = true; faixaAtual = undefined; faixa(MUSICAS.filme);
    }
    if (comecou) { faixaAtual = undefined; faixa(MUSICAS.filme); } else document.addEventListener('pointerdown', primeiro);
  }
  if (P.get('simples') === '1') { mostrarSimples(); return; }

  /* =====================================================================
     O 3D
     ===================================================================== */
  var renderer, proj = null, modo = 'carregando';
  try {
    if (typeof THREE === 'undefined') throw new Error('sem three.js');
    var aa = P.get('aa') ? P.get('aa') === '1' : (window.devicePixelRatio || 1) < 2;
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: aa, alpha: false, stencil: false, powerPreference: 'high-performance' });
  } catch (e) { mostrarSimples(); return; }
  renderer.autoClear = false;
  renderer.setClearColor(0x050308, 1);
  var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pixelRatio);
  F.aniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());

  var cena = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(60, 1, 0.08, 400);
  cam.rotation.order = 'YXZ';

  // a camada de cima: barras de cinema, vinheta, grão e o escurecer
  var uCapa = { uBarra: { value: 0 }, uFade: { value: 1 }, uTempo: F.U.uTempo, uGrao: { value: 0.05 }, uVig: { value: 0.5 }, uRes: { value: new THREE.Vector2(1, 1) }, uEsc: { value: 1.5 } };
  var cenaCapa = new THREE.Scene();
  var capa = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: uCapa,
    vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: [
      'uniform float uBarra; uniform float uFade; uniform float uTempo; uniform float uGrao; uniform float uVig; uniform vec2 uRes; uniform float uEsc;',
      'float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy / uRes;',
      '  float barra = clamp(step(uv.y, uBarra) + step(1.0 - uBarra, uv.y), 0.0, 1.0);',
      '  vec2 q = (uv - 0.5) * vec2(1.0, 0.92);',
      '  float vig = smoothstep(0.34, 0.92, length(q)) * uVig;',
      '  float preto = max(1.0 - (1.0 - vig) * (1.0 - uFade), barra);',
      '  float n = h(floor(gl_FragCoord.xy / uEsc) + fract(uTempo * 3.7) * 200.0);',
      '  float g = abs(n - 0.5) * 2.0 * uGrao * (1.0 - barra) * (1.0 - uFade);',
      '  gl_FragColor = vec4(vec3(step(0.5, n) * g), 1.0 - (1.0 - preto) * (1.0 - g));',
      '}'
    ].join('\n'),
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    depthTest: false, depthWrite: false, transparent: true
  }));
  capa.frustumCulled = false;
  cenaCapa.add(capa);
  var camCapa = new THREE.Camera();

  var fach, sag, sala;
  var S = F.SALA, ASSENTO = S.assento;

  /* ---------- o roteiro da câmera (T = segundos desde o "entrar") ---------- */
  var T_FILME = 55;                     // quando a contagem regressiva começa

    }));
    esperas.push(imagem(TEXTOS.fotoEmBreve).then(function (im) {
      fach.cartaz(1, cartazDe(im, { topo: topo, faixa: TEXTOS.emBreve, titulo: TEXTOS.emBreveTitulo, data: TEXTOS.emBreveData, rodape: rodape }));
    }));
    return Promise.all(esperas);
  }

  var fontes = ['118px "Bebas Neue"', '700 60px "Playfair Display"', 'italic 700 60px "Playfair Display"', 'italic 400 60px "Playfair Display"', '268px Yellowtail'];
  var esperaFontes = (document.fonts && document.fonts.load)
    ? Promise.all(fontes.map(function (f) { return document.fonts.load(f).catch(function () {}); }))
    : Promise.resolve();
  Promise.race([esperaFontes, new Promise(function (ok) { setTimeout(ok, 3500); })]).then(montar).then(function () {
    if (simplesAtivo) return;
    fade = 1; fadeAlvo = 0;
    if (TESTE) {
      elCarregando.style.display = 'none'; elAbertura.style.display = 'none';
      comecou = true; modo = 'passeio'; fade = 0;
      T = parseFloat(P.get('t') || '0') || 0;
      if (P.get('tf')) T = T_FILME + parseFloat(P.get('tf'));
      btnSom.classList.add('aparece');
      window.__filme = {
        quadro: function (dt) { quadro(dt === undefined ? 1 / 60 : dt); },
        t: function (v) { modo = 'passeio'; elFim.classList.remove('visivel'); elNav.classList.remove('visivel'); T = v; quadro(0); },
        tf: function (v) { this.t(T_FILME + v); },
        livre: function () { T = T_FIM; entrarLivre(); luzLivre = 1; quadro(0); },
        saguao: function (k) { modo = 'saguao'; irCartaz(k || 0, true); elFim.classList.remove('visivel'); elNav.classList.add('visivel'); quadro(0); },
        olhar: function (y, p) { yawU = y; pitchU = p; velYaw = velPitch = 0; arrastando = true; quadro(0); arrastando = false; },
        abrir: abrirModal, fechar: fecharModal, proj: proj,
        info: function () {
          return { modo: modo, T: T, T_FILME: T_FILME, T_FIM: T_FIM, dur: proj.dur, plano: proj.estado.indice, fov: cam.fov, pos: cam.position.toArray(),
            chamadas: renderer.info.render.calls, triangulos: renderer.info.render.triangles, texturas: renderer.info.memory.textures, pixelRatio: pixelRatio };
        }
      };
      if (P.get('modo') === 'livre') window.__filme.livre();
      else if (P.get('modo') === 'saguao') window.__filme.saguao(parseInt(P.get('k') || '0', 10));
      else quadro(0);
      document.documentElement.setAttribute('data-pronto', '1');
      return;
    }
    modo = 'abertura';
    elCarregando.classList.add('some'); elAbertura.classList.remove('some');
    var ultimo = performance.now();
    (function laco(agora) {
      if (simplesAtivo) return;
      requestAnimationFrame(laco);
      var dt = Math.min(0.05, (agora - ultimo) / 1000);
      ultimo = agora;
      quadro(dt);
      medirDesempenho(dt);
    })(ultimo);
  }).catch(function () { mostrarSimples(); });
})();
</script>
